name: jscpd

# コピー＆ペーストによる重複が増えていないかを確かめる。jscpd は package.json の依存に
# 入れず、npx の版指定で固定する。設定は .jscpd.json にあり、JSON にはコメントを
# 書けないので設定の根拠はここに残す。
#
# - 版: jscpd 5.4.3（Rust エンジン）
# - 検出の基準: 既定値（min-tokens 50・min-lines 5・mode mild）で exact のみ。
#   .gitignore は既定で除外される（out/・node_modules/・.vscode-test/ など）
# - 実測（2026-11-23）: 10 ファイル・0 クローン、重複率は行 0.00%・トークン 0.00%（この jscpd.yml を含む）
#   （src/ の TypeScript 4 ファイル、package.json・tsconfig.json、eslint.config.mjs、
#   check.yml・release.yml・jscpd.yml。src/constants.ts は min-tokens 未満で測定に入らない）
# - threshold: 行の重複率と比べられ、超えたときだけ失敗する（実測 0% では threshold 0 でも
#   通る）。0.5 に置くと、jscpd が拾う最小級のクローン（50 トークン・11 行で行 1.13%）でも
#   落ちることを確認済みで、新しい重複を止めるゲートとして働く。重複が必要になって実測が
#   上がる場合は、差分レビューで妥当性を確かめてから threshold を上げる
# - ignore（除外しないと 16 ファイル・9 クローン・行 1.84%・トークン 1.84%）:
#   - package-lock.json: npm の生成物のため外す（5 クローン。package.json との重複と
#     lock 内の重複）
#   - README.md: Markdown の TOML コードブロックが測定に入り、config.d の設定例の写しや
#     README 内の例同士で 4 クローン（TOML の行 36.09%）として出るため外す
#   - config.d/**: プロンプトの設定ファイルで製品コードではないため外す
#   - CHANGELOG.md: ドキュメントで製品コードではないため外す（クローンは無い）
#   - .vscode/・.vscode-test.mjs・llm-review.toml・cccc.toml・.env.example は
#     min-tokens 未満などで測定に入らないため、ignore に書いていない
#   - 手元で測るときは --ignore を渡さず .jscpd.json を使う。CLI の --ignore は .jscpd.json の
#     ignore に足されるのではなく置き換えるため、数値がずれる
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  jscpd:
    name: jscpd
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: jscpd
        run: npx --yes jscpd@5.4.3 --no-tips --no-colors .
