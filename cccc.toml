# cccc (https://github.com/moznion/cccc) の設定
#
# 閾値は「現状より悪化させない」ためのラチェットです。
# 実測値の少し上（max + 2）に置いています。
#
# 導入時点の実測値（cccc v1.8.6、7 ファイル・29 関数）:
#   - 認知的複雑度 max 26（src/cli.ts の main）
#   - 循環的複雑度 max 29（src/core.ts の review）
#
# リファクタリング後の実測値（cccc v1.8.6、7 ファイル・39 関数）:
#   - 認知的複雑度 max 8（src/cli.ts の loadIncludedConfigs / loadAndMergeConfigs /
#     deepMerge 内の無名関数）
#   - 循環的複雑度 max 10（src/core.ts の review）
#
# リファクタリングで max が下がったら、この値も引き下げてください。
max-cognitive = 10
max-cyclomatic = 12
